<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — Global AI Venture Studio Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css?v=4">
<link rel="stylesheet" href="awards.css?v=4">
</head>
<body>

<canvas id="particleBg" aria-hidden="true"></canvas>

<main class="reveal">
  <p class="eyebrow">Global AI Venture Studio · Final Results</p>
  <h1 class="reveal__title">And the winners are<span class="dots">&hellip;</span></h1>
  <p class="reveal__subtitle">20 ventures pitched. Three take the podium.</p>

  <div class="podium" id="podium">
    <div class="podium__slot" data-place="3" id="slot-3">
      <div class="podium__card" id="card-3">
        <div class="podium__locked">
          <span class="podium__lock">&#128274;</span>
          <span class="podium__rank-badge">3rd</span>
        </div>
        <div class="podium__revealed" hidden>
          <p class="podium__track" id="track-3"></p>
          <h2 id="title-3"></h2>
          <p class="podium__students" id="students-3"></p>
          <p class="podium__blurb" id="blurb-3"></p>
          <button class="podium__watch-btn" data-place="3">&#9654; Watch pitch</button>
        </div>
      </div>
      <div class="podium__pedestal podium__pedestal--3"><span>3</span></div>
    </div>

    <div class="podium__slot podium__slot--first" data-place="1" id="slot-1">
      <div class="podium__card podium__card--first" id="card-1">
        <div class="podium__locked">
          <span class="podium__lock">&#128274;</span>
          <span class="podium__rank-badge">1st</span>
        </div>
        <div class="podium__revealed" hidden>
          <p class="podium__track" id="track-1"></p>
          <h2 id="title-1"></h2>
          <p class="podium__students" id="students-1"></p>
          <p class="podium__blurb" id="blurb-1"></p>
          <button class="podium__watch-btn" data-place="1">&#9654; Watch pitch</button>
        </div>
      </div>
      <div class="podium__pedestal podium__pedestal--1"><span>1</span></div>
    </div>

    <div class="podium__slot" data-place="2" id="slot-2">
      <div class="podium__card" id="card-2">
        <div class="podium__locked">
          <span class="podium__lock">&#128274;</span>
          <span class="podium__rank-badge">2nd</span>
        </div>
        <div class="podium__revealed" hidden>
          <p class="podium__track" id="track-2"></p>
          <h2 id="title-2"></h2>
          <p class="podium__students" id="students-2"></p>
          <p class="podium__blurb" id="blurb-2"></p>
          <button class="podium__watch-btn" data-place="2">&#9654; Watch pitch</button>
        </div>
      </div>
      <div class="podium__pedestal podium__pedestal--2"><span>2</span></div>
    </div>
  </div>

  <div class="reveal__action">
    <button id="revealBtn" class="reveal-btn">Reveal 3rd Place</button>
    <a id="enterHallBtn" class="reveal-btn reveal-btn--ghost" href="hall.html" hidden>Explore all 20 projects &rarr;</a>
  </div>
</main>

<div id="watchOverlay" class="watch-overlay" hidden></div>
<div id="watchModal" class="watch-modal" hidden aria-hidden="true">
  <button id="watchClose" class="watch-modal__close" aria-label="Close">&#10005;</button>
  <div class="watch-modal__body">
    <h3 id="watchTitle"></h3>
    <div class="watch-media">
      <div class="watch-media__frame">
        <iframe id="watchVideo" title="Pitch video" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
      </div>
      <div class="watch-media__frame watch-media__frame--deck">
        <iframe id="watchDeck" title="Pitch deck"></iframe>
      </div>
    </div>
  </div>
</div>

<script src="data/projects.js?v=4"></script>
<script src="data/winners.js?v=4"></script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script src="awards.js?v=4"></script>
</body>
</html>
